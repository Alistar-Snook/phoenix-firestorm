name: Build

# Manual build of the open-source viewer: no macOS, no private libraries
# (FMOD, KDU, Havok are not included), no code signing. Run it from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel suffix (installer/app name becomes Firestorm-<channel>)'
        default: 'Alistar'
      opensim:
        description: 'Include OpenSim support (adds "OS" to the name; leave off for Second Life only)'
        type: boolean
        default: false
      os_choice:
        description: 'Which platforms to build'
        type: choice
        options: [windows-and-linux, windows-only, linux-only]
        default: windows-and-linux

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.m.outputs.os }}
    steps:
      - id: m
        shell: bash
        run: |
          case "${{ inputs.os_choice }}" in
            windows-only) echo 'os=["windows-2022"]' >> "$GITHUB_OUTPUT" ;;
            linux-only)   echo 'os=["ubuntu-22.04"]' >> "$GITHUB_OUTPUT" ;;
            *)            echo 'os=["windows-2022","ubuntu-22.04"]' >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    needs: matrix
    name: Build / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.matrix.outputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    env:
      AUTOBUILD_VARIABLES_FILE: ${{ github.workspace }}/build-variables/variables
      AUTOBUILD_ADDRSIZE: 64
      AUTOBUILD_VSVER: "170"
      XZ_DEFAULTS: -T0
    steps:
      - name: Get the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout build variables
        uses: actions/checkout@v7
        with:
          repository: FirestormViewer/fs-build-variables
          path: build-variables

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install python requirements
        shell: bash
        run: |
          python -m pip install -r requirements.txt
          python -c "import llsd; print('llsd ok')"

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@main
        with:
          swap-storage: false

      - name: Install GCC 14 and build dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for i in 1 2 3; do
            timeout 60 sudo add-apt-repository -y -n ppa:ubuntu-toolchain-r/test && break || sleep 10
          done
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y gcc-14 g++-14 \
            python3-setuptools pkg-config ninja-build mesa-common-dev \
            libgl1-mesa-dev libglu1-mesa-dev libosmesa6-dev \
            libxinerama-dev libxrandr-dev libxcursor-dev libxfixes-dev libxft-dev \
            libpulse-dev libunwind-dev libpipewire-0.3-dev libdbus-1-dev \
            libglib2.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libvlc-dev libwayland-dev libfreetype6-dev libfontconfig1-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 140 --slave /usr/bin/g++ g++ /usr/bin/g++-14
          echo "CC=gcc-14"  >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Remove private packages (not available in an open build)
        shell: bash
        run: |
          for p in fmodstudio kdu llphysicsextensions_tpv; do
            autobuild installables remove "$p" || true
          done

      - name: Configure
        shell: bash
        run: |
          OPENSIM_FLAG="--no-opensim"
          if [ "${{ inputs.opensim }}" == "true" ]; then OPENSIM_FLAG="--opensim"; fi
          autobuild configure -c ReleaseFS -A 64 -- --package --chan "${{ inputs.channel }}" $OPENSIM_FLAG -DLL_TESTS:BOOL=OFF

      - name: Build
        shell: bash
        run: autobuild build -c ReleaseFS -A 64 --no-configure

      - name: Collect installer
        shell: bash
        run: |
          mkdir -p out
          find build-* "${RUNNER_TEMP:-.}" -maxdepth 4 \( -name '*_Setup.exe' -o -name '*.tar.xz' \) -not -name '*symbols*' -exec cp -v {} out/ \; 2>/dev/null || true
          ls -la out

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Firestorm-${{ inputs.channel }}-${{ runner.os }}
          path: out/*
          if-no-files-found: error
          retention-days: 14


      - name: post release URL
        run: |
          echo "::notice::Release ${{ steps.release.outputs.url }}"
